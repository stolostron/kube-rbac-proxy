# Alertmanager behind kube-rbac-proxy.
#
# This mirrors the kube-rbac-proxy container in MCO's
# operators/multiclusterobservability/manifests/base/alertmanager/alertmanager-statefulset.yaml
# as closely as a kind cluster allows: same flags, same --allow-paths=/metrics,
# same static authorization config file, same client CA wiring.
#
# Two things differ from MCO, because the equivalents are OpenShift-only:
#   * the serving certificate is generated by local/setup-secrets.sh instead of
#     being issued by the service CA operator;
#   * the static authorization subject is this cluster's "prometheus" service
#     account instead of system:serviceaccount:openshift-monitoring:prometheus-k8s.
#     (The OpenShift fork also hardcodes an authorizer for that exact OCP identity,
#     which cannot be exercised here.)
---
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-kube-rbac-proxy-metric
  namespace: krp-demo
type: Opaque
stringData:
  config.yaml: |-
    "authorization":
      "static":
      - "path": "/metrics"
        "resourceRequest": false
        "user":
          "name": "system:serviceaccount:krp-demo:prometheus"
        "verb": "get"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: krp-demo
data:
  alertmanager.yml: |
    route:
      receiver: devnull
    receivers:
      - name: devnull
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: krp-demo
spec:
  selector:
    app: alertmanager
  ports:
    - name: metrics
      port: 9096
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: krp-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      serviceAccountName: alertmanager
      securityContext:
        runAsNonRoot: true
        # Must be numeric: the upstream images declare a named user ("nobody"),
        # which the kubelet cannot verify against runAsNonRoot on its own.
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: alertmanager
          image: quay.io/prometheus/alertmanager:v0.27.0
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
            # Bind to loopback only, so the proxy is the sole way in.
            - --web.listen-address=127.0.0.1:9093
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: data
              mountPath: /alertmanager
          resources:
            requests:
              cpu: 10m
              memory: 32Mi

        - name: kube-rbac-proxy
          image: localhost/kube-rbac-proxy:local
          imagePullPolicy: IfNotPresent
          args:
            - --secure-listen-address=0.0.0.0:9096
            - --upstream=http://127.0.0.1:9093
            - --config-file=/etc/kube-rbac-proxy/config.yaml
            - --tls-cert-file=/etc/tls/private/tls.crt
            - --tls-private-key-file=/etc/tls/private/tls.key
            - --client-ca-file=/etc/tls/client/client-ca-file
            - --logtostderr=true
            - --allow-paths=/metrics
          ports:
            - name: metrics
              containerPort: 9096
          volumeMounts:
            - name: tls-metrics-secret
              mountPath: /etc/tls/private
              readOnly: true
            - name: kube-rbac-proxy-metric
              mountPath: /etc/kube-rbac-proxy
              readOnly: true
            - name: metrics-client-ca
              mountPath: /etc/tls/client
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 20Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: data
          emptyDir: {}
        - name: tls-metrics-secret
          secret:
            secretName: alertmanager-tls-metrics
        - name: kube-rbac-proxy-metric
          secret:
            secretName: alertmanager-kube-rbac-proxy-metric
        - name: metrics-client-ca
          configMap:
            name: alertmanager-clientca-metric
